name: Test FLEX Native SDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Verify SDK
        run: |
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"

          test -f "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIGlassEffect.h"

      - name: Build FLEX
        run: |
          xcodebuild \
            -project FLEX.xcodeproj \
            -scheme FLEX \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
